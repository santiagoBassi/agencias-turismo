<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hybris Turismo — Prototipo App del Viajero</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Marca de la agencia (theming). Tema actual: Hybris Turismo.
     Default de plataforma si la agencia no configura nada: --brand:#4f46e5;--brand-d:#4338ca;--brand-l:#eef2ff; */
  --brand:#0e7490;--brand-d:#155e75;--brand-l:#ecfeff;
  --tx:#0f172a;--t2:#334155;--mu:#64748b;
  --bg:#f8fafc;--wh:#fff;--br:#e2e8f0;
  --gn:#10b981;--am:#f59e0b;--rd:#ef4444;--pu:#8b5cf6;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:#c8c8c8;overflow:hidden;min-height:100vh}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#1e1e1e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:1000;user-select:none}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-ico{width:30px;height:30px;background:linear-gradient(135deg,var(--brand),var(--brand-d));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
.tb-t{font-size:14px;font-weight:700;color:#f1f5f9}
.tb-s{font-size:11px;color:#64748b}
.tb-r{display:flex;align-items:center;gap:6px}
.zbtn{height:28px;min-width:28px;padding:0 8px;background:#2d2d2d;border:1px solid #444;border-radius:6px;color:#e2e8f0;cursor:pointer;font-size:14px;font-weight:700;transition:background .12s;font-family:inherit}
.zbtn:hover{background:#3d3d3d}
.zval{font-size:12px;color:#94a3b8;min-width:40px;text-align:center}

/* BOARD */
#board{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:auto;background-color:#c4c4c4;background-image:radial-gradient(circle,#aaa 1px,transparent 1px);background-size:24px 24px}
#bi{display:flex;flex-wrap:wrap;gap:60px;padding:60px;min-width:max-content;transform-origin:top left}

/* FRAME */
.fc{display:flex;flex-direction:column;align-items:center;gap:12px}
.fc-lbl{font-size:11px;font-weight:600;color:#555;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.7);padding:4px 10px;border-radius:20px}

/* PHONE */
.phone{width:285px;height:598px;background:#111;border-radius:46px;padding:13px;box-shadow:0 0 0 1px #2a2a2a,inset 0 0 0 1px #3a3a3a,0 32px 80px rgba(0,0,0,.45),0 10px 20px rgba(0,0,0,.25);position:relative;flex-shrink:0}
.phone::before{content:'';position:absolute;left:-4px;top:90px;width:4px;height:66px;background:#1a1a1a;border-radius:3px 0 0 3px;box-shadow:0 -36px 0 #1a1a1a,0 36px 0 #1a1a1a}
.phone::after{content:'';position:absolute;right:-4px;top:128px;width:4px;height:80px;background:#1a1a1a;border-radius:0 3px 3px 0}

/* PHONE SCREEN */
.ps{width:100%;height:100%;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.di{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:88px;height:27px;background:#111;border-radius:20px;z-index:30;pointer-events:none}

/* SCREENS WRAPPER */
.sw{flex:1;position:relative;overflow:hidden;min-height:0}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;flex-direction:column;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:flex}

/* STATUS BAR */
.sb{height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 9px;flex-shrink:0;position:relative;z-index:5}
.sb svg{display:block;width:16px;height:16px}
.sb-i{display:flex;align-items:center;gap:4px}

/* BOTTOM NAV */
.bn{height:62px;background:#fff;border-top:1px solid var(--br);display:grid;grid-template-columns:repeat(4,1fr);flex-shrink:0;padding-bottom:6px}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--mu);transition:color .12s;user-select:none;-webkit-tap-highlight-color:transparent}
.bni:hover{color:var(--t2)}
.bni.on{color:var(--brand)}
.bni svg{width:20px;height:20px}
.bni-l{font-size:9px;font-weight:600;letter-spacing:.01em}

/* SHARED */
.back{display:flex;align-items:center;gap:5px;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:14px 16px 6px;user-select:none;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.sec-l{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.07em;text-transform:uppercase;padding:14px 16px 8px;flex-shrink:0}
.card{background:#fff;border-radius:16px;padding:14px;margin:0 12px 10px;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.98)}
.cards{background:#fff;border-radius:16px;padding:14px;margin:0 12px 10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.p-bl{background:var(--brand-l);color:var(--brand)}
.p-gn{background:#d1fae5;color:#065f46}
.p-am{background:#fef3c7;color:#92400e}
.p-pu{background:#f5f3ff;color:#5b21b6}
.dr{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--br);background:#fff;flex-shrink:0}
.dr:last-child{border-bottom:none}
.dr-l{font-size:12px;color:var(--mu)}
.dr-v{font-size:13px;font-weight:600;color:var(--tx);text-align:right;max-width:62%}
.safe{height:20px;flex-shrink:0}

/* SPLASH */
.sp-hero{height:288px;flex-shrink:0;background:linear-gradient(165deg,#0f172a 0%,#c2410c 100%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;overflow:hidden}
.sp-c1{position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05);top:-60px;right:-60px}
.sp-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,transparent 55%)}
.sp-txt{position:relative;z-index:1}
.sp-ag{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.sp-dst{font-size:30px;font-weight:900;color:#fff;line-height:1.05;letter-spacing:-.02em}
.sp-dt{font-size:13px;color:rgba(255,255,255,.85);margin-top:6px;font-weight:500}
.sp-body{flex:1;background:#fff;padding:16px 16px 14px;display:flex;flex-direction:column;min-height:0}
.sp-lr{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-shrink:0}
.sp-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.sp-wn{font-size:17px;font-weight:800;color:var(--tx)}
.sp-wt{font-size:11px;color:var(--mu);font-weight:500}
.sp-gr{font-size:14px;color:var(--tx);margin-bottom:4px;flex-shrink:0}
.sp-dc{font-size:12px;color:var(--mu);line-height:1.5;margin-bottom:14px;flex:1}
.btn-p{display:block;width:100%;background:var(--brand);color:#fff;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;transition:background .15s,transform .1s;font-family:inherit;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.btn-p:hover{background:var(--brand-d)}
.btn-p:active{transform:scale(.98)}
.sp-pwr{font-size:9px;color:var(--mu);text-align:center;margin-top:10px;flex-shrink:0;letter-spacing:.02em}

/* HOME */
.hm-hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);padding:16px 16px 20px;flex-shrink:0}
.hm-gr{font-size:13px;color:rgba(255,255,255,.82);font-weight:500}
.hm-nm{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em}
.hm-tr{font-size:12px;color:rgba(255,255,255,.7);margin-top:5px}
.cd{margin:12px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px rgba(14,116,144,.15),0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--brand);cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent}
.cd:active{transform:scale(.98)}
.cd-top{font-size:10px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.cd-row{display:flex;align-items:center;justify-content:space-between}
.cd-inf h3{font-size:15px;font-weight:700;color:var(--tx)}
.cd-inf p{font-size:11px;color:var(--mu);margin-top:3px}
.cd-num{font-size:36px;font-weight:900;color:var(--brand);line-height:1;letter-spacing:-.03em;text-align:right}
.cd-unit{font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:right}
.ts{margin:0 12px 12px;background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border-radius:14px;padding:14px}
.ts-t{font-size:12px;font-weight:700;color:#0369a1;margin-bottom:10px}
.ts-r{display:flex;gap:16px}
.ts-i{flex:1}
.ts-v{font-size:16px;font-weight:800;color:var(--tx)}
.ts-l{font-size:10px;color:#64748b;margin-top:2px;font-weight:500}

/* ITINERARY */
.it-hd{background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--br);flex-shrink:0}
.it-hd h2{font-size:18px;font-weight:800;color:var(--tx)}
.it-hd p{font-size:12px;color:var(--mu);margin-top:2px}
.tl{padding:16px 0}
.tl-day{padding:0 16px 8px 50px;position:relative;margin-bottom:6px}
.tl-dot{position:absolute;left:16px;top:4px;width:24px;height:24px;background:var(--brand);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;z-index:2}
.tl-line{position:absolute;left:27px;top:28px;bottom:0;width:2px;background:var(--br)}
.tl-dh{margin-bottom:8px}
.tl-dt{font-size:14px;font-weight:700;color:var(--tx)}
.tl-dd{font-size:11px;color:var(--mu);margin-top:1px}
.tl-ev{background:#fff;border-radius:11px;padding:10px 12px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;gap:9px;align-items:center;cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent}
.tl-ev:active{transform:scale(.98)}
.tl-ic{font-size:17px;flex-shrink:0;margin-top:1px}
.tl-ti{font-size:12px;font-weight:600;color:var(--tx)}
.tl-tm{font-size:10px;color:var(--mu);margin-top:2px}

/* FLIGHT */
.fl-hero{background:linear-gradient(155deg,#0f172a 0%,#1e3a5f 100%);padding:18px 16px 20px;flex-shrink:0}
.fl-al{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.fl-al-lg{width:34px;height:34px;background:var(--brand);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.fl-al-nm{font-size:14px;font-weight:700;color:rgba(255,255,255,.95)}
.fl-al-cd{font-size:11px;color:rgba(255,255,255,.6)}
.fl-rt{display:flex;align-items:flex-start}
.fl-end{flex:1}
.fl-end.r{text-align:right}
.fl-cd{font-size:30px;font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1}
.fl-cy{font-size:10px;color:rgba(255,255,255,.65);margin-top:3px}
.fl-ti{font-size:15px;font-weight:700;color:rgba(255,255,255,.9);margin-top:5px}
.fl-da{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px}
.fl-mid{display:flex;flex-direction:column;align-items:center;padding:0 8px;padding-top:6px;flex:.7}
.fl-lr{display:flex;align-items:center;width:100%}
.fl-hl{flex:1;height:1px;background:rgba(255,255,255,.25)}
.fl-pl{font-size:18px;margin:0 4px}
.fl-dr{font-size:10px;color:rgba(255,255,255,.55);margin-top:5px}

/* HOTEL */
.ht-hero{height:130px;background:linear-gradient(160deg,#78350f 0%,#d97706 100%);position:relative;flex-shrink:0;display:flex;align-items:flex-end;padding:14px;overflow:hidden}
.ht-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 55%)}
.ht-ht{position:relative;z-index:1}
.ht-nm{font-size:17px;font-weight:800;color:#fff;line-height:1.2}
.ht-st{color:#fbbf24;font-size:12px;margin-top:3px}
.ht-lc{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px}
.map-ph{margin:10px 12px;height:90px;background:#e2e8f0;border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.map-gl{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.4) 1px,transparent 1px);background-size:18px 18px}
.map-rh{position:absolute;left:0;right:0;height:8px;background:rgba(255,255,255,.7);top:50%;transform:translateY(-50%)}
.map-rv{position:absolute;top:0;bottom:0;width:8px;background:rgba(255,255,255,.7);left:45%}
.map-pin{position:relative;z-index:1;font-size:24px}

/* DOCS */
.docs-hd{background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--br);flex-shrink:0}
.docs-hd h2{font-size:18px;font-weight:800;color:var(--tx)}
.docs-hd p{font-size:12px;color:var(--mu);margin-top:2px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.dc{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;transition:transform .1s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.dc:active{transform:scale(.96)}
.dc-ic{font-size:28px;margin-bottom:8px}
.dc-nm{font-size:12px;font-weight:700;color:var(--tx);line-height:1.3}
.dc-sb{font-size:10px;color:var(--mu);margin-top:4px}
.dc-dot{position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%}
.dc-g{background:var(--gn)}
.dc-a{background:var(--am)}

/* INSURANCE */
.ins-hero{background:linear-gradient(135deg,#065f46 0%,#10b981 100%);padding:18px 16px;flex-shrink:0}
.ins-tp{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ins-lg{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;border:1.5px solid rgba(255,255,255,.3)}
.ins-nm{font-size:18px;font-weight:800;color:#fff}
.ins-ty{font-size:12px;color:rgba(255,255,255,.8);font-weight:500}
.ins-pol{background:rgba(0,0,0,.15);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}
.ins-pl{font-size:10px;color:rgba(255,255,255,.75);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ins-pv{font-size:13px;font-weight:700;color:#fff}
.cov{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--br);background:#fff;flex-shrink:0}
.cov:last-of-type{border-bottom:none}
.cov-ck{font-size:15px;flex-shrink:0;margin-top:1px}
.cov-ti{font-size:13px;font-weight:600;color:var(--tx)}
.cov-am{font-size:11px;color:var(--mu);margin-top:2px}
.sos{margin:10px 12px;background:linear-gradient(135deg,#dc2626,#ef4444);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.sos-ic{font-size:26px}
.sos-ti{font-size:14px;font-weight:800;color:#fff}
.sos-nm{font-size:17px;font-weight:900;color:#fff;margin-top:2px;letter-spacing:.02em}

/* EXPLORE */
.ex-hero{height:140px;background:linear-gradient(160deg,#581c87 0%,#db2777 100%);padding:16px;display:flex;flex-direction:column;justify-content:flex-end;flex-shrink:0;position:relative;overflow:hidden}
.ex-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.38) 0%,transparent 55%)}
.ex-ht{position:relative;z-index:1}
.ex-cy{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.02em}
.ex-sb{font-size:12px;color:rgba(255,255,255,.88);margin-top:3px}
.cat-r{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.cat-r::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);flex-shrink:0;-webkit-tap-highlight-color:transparent;background:#fff;color:var(--tx)}
.chip.on{background:var(--brand);color:#fff}
.poi{margin:0 12px 10px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);flex-shrink:0}
.poi-img{height:76px;display:flex;align-items:center;justify-content:center;font-size:34px}
.poi-bd{padding:10px 12px 12px}
.poi-nm{font-size:13px;font-weight:700;color:var(--tx)}
.poi-dc{font-size:11px;color:var(--mu);margin-top:3px;line-height:1.4}
.poi-mt{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}

/* EXCURSIONS */
.exc-hd{background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--br);flex-shrink:0}
.exc-hd h2{font-size:18px;font-weight:800;color:var(--tx)}
.exc-hd p{font-size:12px;color:var(--mu);margin-top:2px}
.exc{margin:0 12px 10px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);flex-shrink:0}
.exc-img{height:88px;display:flex;align-items:center;justify-content:center;font-size:40px}
.exc-bd{padding:12px}
.exc-nm{font-size:13px;font-weight:700;color:var(--tx)}
.exc-dt{font-size:12px;color:var(--brand);font-weight:700;margin-top:3px}
.exc-dc{font-size:11px;color:var(--mu);margin-top:4px;line-height:1.4}
.exc-mt{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}

/* PASO DE ITINERARIO (detalle genérico) + VISOR DE DOCUMENTO ORIGINAL */
.st-hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);padding:18px 16px;flex-shrink:0}
.doc-frame{width:100%;height:340px;border:none;display:block;background:#f1f5f9}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-l">
    <div class="tb-ico">✈</div>
    <div>
      <div class="tb-t">Hybris Turismo</div>
      <div class="tb-s">Peregrí · Prototipo App del Viajero</div>
    </div>
  </div>
  <div class="tb-r">
    <button class="zbtn" onclick="zd(-.1)">−</button>
    <span class="zval" id="zv">100%</span>
    <button class="zbtn" onclick="zd(.1)">+</button>
    <button class="zbtn" onclick="zr()" style="font-size:11px">100%</button>
  </div>
</header>

<div id="board">
  <div id="bi"></div>
</div>

<script>
// ── Icons ────────────────────────────────────────────────────────────────────
const IC = {
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  doc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,

// estado del check-in de un vuelo en el instante NOW, dada la ventana de la aerolínea.
function estadoCheckin(fechaHoraSalida, ventanaHoras) {
  const salida = new Date(fechaHoraSalida);
  const abre = new Date(salida.getTime() - ventanaHoras * 3600 * 1000);
  if (NOW < abre) return { estado: 'cerrado', abre };
  if (NOW >= salida) return { estado: 'vencido', abre };
  return { estado: 'abierto', abre };
}

function fmtFechaHora(d) {
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} hs`;
}

function fmtFechaCorta(iso) {
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${meses[m - 1]} ${y}`;
}

// ── Render del itinerario a partir de trip.pasos, agrupado por día ──
function renderItinerary(f, trip) {
  const porDia = {};
  trip.pasos.forEach(p => (porDia[p.dia] = porDia[p.dia] || []).push(p));
  const diasOrdenados = Object.keys(porDia).map(Number).sort((a, b) => a - b);
  const ultimo = diasOrdenados[diasOrdenados.length - 1];
  return diasOrdenados.map(dia => {
    const info = trip.dias[dia] || { label:`Día ${dia}`, fecha:'' };
    const eventos = porDia[dia].map(p => `
      <div class="tl-ev" onclick="nav('${f}','paso-${p.id}')">
        <div class="tl-ic">${p.icono}</div>
        <div style="flex:1"><div class="tl-ti">${p.titulo}</div><div class="tl-tm">${p.hora}${p.subtitulo ? ' · ' + p.subtitulo : ''}${p.documento ? ' · 📄' : ''}</div></div>
        <div style="color:var(--mu);font-size:14px">›</div>
      </div>`).join('');
    return `<div class="tl-day">
      <div class="tl-dot">${dia}</div>${dia !== ultimo ? '<div class="tl-line"></div>' : ''}
      <div class="tl-dh"><div class="tl-dt">${info.label}</div><div class="tl-dd">${info.fecha}</div></div>
      ${eventos}
    </div>`;
  }).join('');
}

// ── Pill minimalista de check-in, para insertar DENTRO de la card "Próximo en
//    tu viaje" de Home (no una card aparte) — solo aparece si ya está abierto. ──

  const p = trip.pasos.find(p => p.tipo === 'vuelo' && p.datos && p.datos.fechaHoraSalida

}

  if (!p || p.tipo !== 'vuelo' || !p.datos || !p.datos.fechaHoraSalida) return '';
  const al = AEROLINEAS[p.datos.codigoAerolinea];
  if (!al) return '';
  const r = estadoCheckin(p.datos.fechaHoraSalida, al.ventanaHoras);
  const pnr = (p.referencias.find(x => x.tipo === 'pnr') || {}).valor || '';
  if (r.estado === 'abierto') {
    return `<div class="sec-l">Check-in online</div>
    <div class="cards" style="background:#ecfdf5;border:1px solid #6ee7b7">
      <div style="font-size:13px;font-weight:800;color:#065f46;margin-bottom:8px">✓ Check-in abierto</div>
      <a href="${al.urlCheckin}" target="_blank" style="display:block;text-align:center;background:var(--gn);color:#fff;border-radius:12px;padding:12px;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:8px">Hacer check-in en ${al.nombre} ↗</a>
      <div style="font-size:11px;color:#065f46">Vas a necesitar tu código de reserva: <b>${pnr}</b></div>
    </div>`;
  }
  if (r.estado === 'vencido') {
    return `<div class="sec-l">Check-in online</div>
    <div class="cards"><div style="font-size:12px;color:var(--mu)">La ventana de check-in online ya cerró — presentate directamente en el mostrador de ${al.nombre}.</div></div>`;
  }
  return `<div class="sec-l">Check-in online</div>
    <div class="cards"><div style="font-size:12px;color:var(--mu)">Todavía no abre. Se habilita ${al.ventanaHoras} hs antes de tu vuelo — el ${fmtFechaHora(r.abre)}.</div></div>`;
}

// ── Bloque "Documento original": visor embebido (PDF o imagen), Abrir y Descargar,
//    o estado vacío si el paso no tiene documento asociado. ──
function docRawHtml(doc) {
  if (!doc) {
    return `<div class="cards" style="text-align:center;color:var(--mu)">
      <div style="font-size:22px;margin-bottom:4px">📭</div>
      <div style="font-size:12px;font-weight:600;color:var(--t2)">Sin documento asociado</div>
      <div style="font-size:11px;margin-top:2px">Este paso lo armó tu agencia — no viene de un archivo cargado.</div>
    </div>`;
  }
  const visor = doc.tipo === 'imagen'
    ? `<img src="${doc.ruta}" style="width:100%;display:block;max-height:340px;object-fit:contain;background:#f1f5f9">`
    : `<iframe class="doc-frame" src="${doc.ruta}#page=${doc.pagina}&toolbar=0" loading="lazy"></iframe>`;
  return `<div class="cards" style="padding:0;overflow:hidden">
    <div style="padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--br)">
      <div style="font-size:16px">📄</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${doc.nombre}</div>
        <div style="font-size:10px;color:var(--mu)">${doc.paginas} pág${doc.paginas > 1 ? 's' : ''} · ${doc.tamano}</div>
      </div>
    </div>
    ${visor}
    <div style="display:flex;gap:8px;padding:10px 12px">
      <a href="${doc.ruta}" target="_blank" style="flex:1;text-align:center;background:var(--brand-l);color:var(--brand);border-radius:10px;padding:9px;font-size:12px;font-weight:700;text-decoration:none">Abrir ↗</a>

  </div>`;
}

// ── Pantalla "Dinero": cotización de referencia + conversor + tabla rápida ──
function moneyCardInner(d) {
  return `<div style="display:flex;align-items:center;gap:12px">
    <div style="font-size:32px">${d.flag}</div>
    <div>
      <div style="font-size:16px;font-weight:800;color:var(--tx)">1 ${d.simbolo} = $${cotizacion(d.moneda).toLocaleString('es-AR')} ARS</div>
      <div style="font-size:11px;color:var(--mu);margin-top:2px">${d.pais} · ${d.moneda} · Actualizado ${FX.actualizado}</div>
    </div>
  </div>`;
}
function moneyRefTable(d) {
  const tasa = cotizacion(d.moneda);
  return [1, 5, 10, 20, 50, 100].map(m =>
    `<div class="dr"><div class="dr-l">${m} ${d.simbolo}</div><div class="dr-v">$${Math.round(m * tasa).toLocaleString('es-AR')} ARS</div></div>`
  ).join('');
}
const MONEY_STATE = {};
function selectMoneyChip(f, idx) {
  const trip = FRAME_TRIPS[f];
  const d = trip.destinos[idx];
  MONEY_STATE[f] = d;
  document.querySelectorAll(`#money-chips-${f} .chip`).forEach((c, i) => c.classList.toggle('on', i === idx));
  document.getElementById(`money-card-${f}`).innerHTML = moneyCardInner(d);
  document.getElementById(`money-ref-${f}`).innerHTML = moneyRefTable(d);
  document.getElementById(`money-lbl-${f}`).textContent = d.moneda;
  convertMoney(f, 'ars');
}
function convertMoney(f, from) {
  const trip = FRAME_TRIPS[f];
  const d = MONEY_STATE[f] || trip.destinos[0];
  const tasa = cotizacion(d.moneda);
  const arsEl = document.getElementById(`money-ars-${f}`);
  const extEl = document.getElementById(`money-ext-${f}`);
  if (!arsEl || !extEl) return;
  if (from === 'ars') extEl.value = (parseFloat(arsEl.value || 0) / tasa).toFixed(2);
  else arsEl.value = Math.round(parseFloat(extEl.value || 0) * tasa);
}
function moneyScreen(f, trip) {
  const chips = trip.destinos.map((d, i) =>
    `<div class="chip ${i === 0 ? 'on' : ''}" onclick="selectMoneyChip('${f}',${i})">${d.flag} ${d.pais}</div>`
  ).join('');
  return `<div class="scr" data-s="money">
${SBD}
<div class="back" onclick="nav('${f}','home')">${IC.bk} Inicio</div>
<div class="sec-l">Tipo de cambio${trip.destinos.length > 1 ? ' · elegí el país' : ''}</div>
<div class="cat-r" id="money-chips-${f}">${chips}</div>
<div class="cards" id="money-card-${f}">${moneyCardInner(trip.destinos[0])}</div>
<div class="sec-l">Conversor</div>
<div class="cards">
  <div style="display:flex;gap:10px;align-items:flex-end">
    <div style="flex:1">
      <div style="font-size:10px;color:var(--mu);margin-bottom:4px;font-weight:600">PESOS (ARS)</div>
      <input id="money-ars-${f}" type="number" value="10000" oninput="convertMoney('${f}','ars')" style="width:100%;border:1px solid var(--br);border-radius:10px;padding:10px;font-size:15px;font-weight:700;font-family:inherit">
    </div>
    <div style="font-size:18px;color:var(--mu);padding-bottom:10px">=</div>
    <div style="flex:1">
      <div style="font-size:10px;color:var(--mu);margin-bottom:4px;font-weight:600" id="money-lbl-${f}">${trip.destinos[0].moneda}</div>
      <input id="money-ext-${f}" type="number" value="0" oninput="convertMoney('${f}','ext')" style="width:100%;border:1px solid var(--br);border-radius:10px;padding:10px;font-size:15px;font-weight:700;font-family:inherit">
    </div>
  </div>
</div>
<div class="sec-l">Referencia rápida</div>
<div class="cards" id="money-ref-${f}">${moneyRefTable(trip.destinos[0])}</div>
<div class="cards" style="background:linear-gradient(135deg,#f0f9ff,#e0f2fe)">
  <div style="font-size:12px;font-weight:700;color:#0369a1;margin-bottom:6px">💡 Tips de pago</div>
  <div style="font-size:11px;color:#334155;line-height:1.6">La tarjeta suele tener mejor cambio que el efectivo. Llevá algo de moneda local para taxis y propinas. Cotización de referencia — la actualiza tu agencia.</div>
</div>
<div class="safe"></div>
</div>`;
}

// ── Bottom nav ────────────────────────────────────────────────────────────────
function makeNav(f) {
  const tabs = [
    { id:'home',      ic:IC.home, lbl:'Inicio' },
    { id:'itinerary', ic:IC.cal,  lbl:'Itinerario' },
    { id:'docs',      ic:IC.doc,  lbl:'Docs' },
    { id:'explore',   ic:IC.cmp,  lbl:'Explorar' },
  ];
  return tabs.map(t =>
    `<div class="bni" data-tab="${t.id}" onclick="nav('${f}','${t.id}')">${t.ic}<span class="bni-l">${t.lbl}</span></div>`
  ).join('');
}

// ── Navigation ────────────────────────────────────────────────────────────────
const TAB_MAP = {
  home:'home', itinerary:'itinerary', docs:'docs', explore:'explore',
  flight:'home', hotel:'home', money:'home',
  insurance:'docs', boarding:'docs', voucher:'docs', passport:'docs',
  excursions:'explore',
  splash:null,
};

function nav(fid, screen) {
  const frame = document.getElementById(fid);
  if (!frame) return;
  frame.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  const target = frame.querySelector('[data-s="' + screen + '"]');
  if (target) { target.classList.add('on'); target.scrollTop = 0; }
  const activeTab = TAB_MAP[screen] ?? (screen.startsWith('paso-') ? 'itinerary' : null);
  frame.querySelectorAll('.bni').forEach(b => b.classList.toggle('on', b.dataset.tab === activeTab));
  const bn = frame.querySelector('.bn');
  if (bn) bn.style.display = screen === 'splash' ? 'none' : 'grid';
}

// ── Build board ───────────────────────────────────────────────────────────────
const FRAMES = [
  { id:'f1',  label:'1 · Bienvenida',                          start:'splash',     trip:TRIP },
  { id:'f2',  label:'2 · Inicio',                              start:'home',       trip:TRIP },
  { id:'f3',  label:'3 · Itinerario',                          start:'itinerary',  trip:TRIP },
  { id:'f4',  label:'4 · Vuelo',                                start:'flight',     trip:TRIP },
  { id:'f5',  label:'5 · Hotel',                                start:'hotel',      trip:TRIP },
  { id:'f6',  label:'6 · Documentos',                           start:'docs',       trip:TRIP },
  { id:'f7',  label:'7 · Seguro',                               start:'insurance',  trip:TRIP },
  { id:'f8',  label:'8 · Explorar Roma',                        start:'explore',    trip:TRIP },
  { id:'f9',  label:'9 · Excursiones',                          start:'excursions', trip:TRIP },
  { id:'f10', label:'10 · Detalle de paso (check-in abierto)',  start:'paso-p1',    trip:TRIP },
  { id:'f11', label:'11 · Dinero',                              start:'money',      trip:TRIP },
  { id:'f12', label:'12 · Dinero · viaje multi-país',           start:'money',      trip:TRIP_MULTI },
];

function buildBoard() {
  const bi = document.getElementById('bi');
  FRAMES.forEach(({ id, label, start, trip }) => {
    FRAME_TRIPS[id] = trip;
    const fc = document.createElement('div');
    fc.className = 'fc';
    fc.innerHTML =
      '<div class="fc-lbl">' + label + '</div>' +
      '<div class="phone"><div class="ps" id="' + id + '">' +
        '<div class="di"></div>' +
        '<div class="sw"></div>' +
        '<nav class="bn"></nav>' +
      '</div></div>';
    bi.appendChild(fc);

    const ps  = document.getElementById(id);
    const sw  = ps.querySelector('.sw');
    const sc  = makeScreens(id, trip);
    sw.innerHTML = Object.values(sc).join('');
    ps.querySelector('.bn').innerHTML = makeNav(id);
    nav(id, start);
  });
  // inicializa el conversor de moneda de cada frame que tenga pantalla "money"
  FRAMES.forEach(({ id }) => { if (document.getElementById('money-ars-' + id)) convertMoney(id, 'ars'); });
}

// ── Zoom ──────────────────────────────────────────────────────────────────────
let scale = 1;
function zd(delta) {
  scale = Math.min(2, Math.max(0.35, Math.round((scale + delta) * 10) / 10));
  document.getElementById('bi').style.zoom = scale;
  document.getElementById('zv').textContent = Math.round(scale * 100) + '%';
}
function zr() {
  scale = 1;
  document.getElementById('bi').style.zoom = 1;
  document.getElementById('zv').textContent = '100%';
}

document.addEventListener('DOMContentLoaded', buildBoard);
</script>
